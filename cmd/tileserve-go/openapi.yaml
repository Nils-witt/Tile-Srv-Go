openapi: 3.0.3
info:
  title: tileserve-go
  description: >
    A small Go HTTP server for managing maps and their versioned tile uploads,
    backed by Postgres and secured with JWT authentication. Maps have
    versioned zip uploads extracted to `<data-root>/<uuid>/<version>/` on
    disk, served back at `/maps/{id}/version/{version}/...`.
  version: "1.0.0"
servers:
  - url: http://localhost:8085

tags:
  - name: auth
    description: Login and token issuance
  - name: maps
    description: CRUD and version uploads for maps
  - name: users
    description: Admin-only user account management
  - name: files
    description: Serving extracted map/tile files
  - name: ui
    description: Browser-based management UI
  - name: health
    description: Health check

security:
  - bearerAuth: []
  - tokenQuery: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /login:
    get:
      tags: [auth]
      summary: Login page
      description: Returns a self-contained HTML page with a sign-in form that obtains a JWT.
      security: []
      responses:
        "200":
          description: HTML login page
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [auth]
      summary: Exchange credentials for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request body
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Invalid credentials
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new JWT
      description: >-
        Redeems a refresh token (issued by POST /login or a previous call to
        this endpoint) for a new login JWT, without re-sending credentials.
        The refresh token is single-use: this call also revokes it and
        returns a new one to use next time.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request body
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Invalid, expired, or already-used refresh token
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /ui/:
    get:
      tags: [ui]
      summary: Management UI
      description: >-
        Self-contained HTML/JS page for managing maps (create/edit/delete,
        upload versions, view history). The page itself is public; it signs
        in via POST /login and drives the rest of this API with the
        resulting token.
      security: []
      responses:
        "200":
          description: HTML management UI
          content:
            text/html:
              schema:
                type: string

  /maps:
    get:
      tags: [maps]
      summary: List maps
      description: >-
        Returns only the maps the acting user may see: maps marked
        `visibleToAll`, maps they created, maps they hold a per-map
        view/edit/delete grant on, admins, and users whose global `can_edit`
        or `can_delete` permission already lets them act on every map.
      responses:
        "200":
          description: Array of visible maps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Map"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [maps]
      summary: Create a map
      description: Requires the acting user's `can_create` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapRequest"
      responses:
        "201":
          description: Map created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map"
        "400":
          description: Invalid request body or missing name
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /maps/{id}:
    parameters:
      - $ref: "#/components/parameters/MapId"
    get:
      tags: [maps]
      summary: Get a map
      description: Requires view access to this map (see `GET /maps`); returns 403 if the map is private and the acting user can't see it.
      responses:
        "200":
          description: The map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map"
        "400":
          description: Invalid map id
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [maps]
      summary: Replace a map's name/currentVersion/visibleToAll/anonymousAllowed
      description: >
        Requires the acting user's `can_edit` permission (global or per-map).
        `name`, `currentVersion`, `visibleToAll`, and `anonymousAllowed` are
        replaced; this does not touch the map_versions history or any
        extracted files on disk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapRequest"
      responses:
        "200":
          description: Updated map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map"
        "400":
          description: Invalid request body or missing name
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [maps]
      summary: Delete a map
      description: Requires the acting user's `can_delete` permission. Cascades and deletes the map's version history.
      responses:
        "204":
          description: Map deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /maps/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/MapId"
    get:
      tags: [maps]
      summary: List a map's upload history
      description: >-
        Returns every version ever uploaded for this map, most recent first.
        Requires view access to this map (see `GET /maps`).
      responses:
        "200":
          description: Array of versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /maps/{id}/upload:
    parameters:
      - $ref: "#/components/parameters/MapId"
    post:
      tags: [maps]
      summary: Upload a new map version
      description: >
        Requires the acting user's `can_create` permission. The request body
        is a zip file (max 1 GiB), extracted to
        `<data-root>/<uuid>/<version>/`. `<version>` is one more than the
        highest version recorded in this map's history (0 if none yet); it is
        never derived from the map's `currentVersion` field. On success both
        `maps.current_version` and a new `map_versions` row are written
        atomically. The zip's contents should form a numeric tile pyramid:
        every directory name must be all digits, and every file must be named
        `<number>.png` (e.g. `3/1/2.png`, or `5.png` at the top level).
        Entries that don't match this (or are symlinks, or attempt path
        traversal) are silently skipped rather than failing the upload; the
        version is still created from whatever did extract successfully.
        After extraction, an `index.json` listing every `{z, x, y}` tile
        found (sorted by z, then x, then y) is written alongside the tiles
        and served like any other file under this version.
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Version stored; returns the map with its updated currentVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map"
        "400":
          description: Unreadable zip archive
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Upload exceeds the 1 GiB limit
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /maps/{id}/permissions:
    parameters:
      - $ref: "#/components/parameters/MapId"
    get:
      tags: [maps]
      summary: List a map's per-user permission grants
      description: >-
        Requires the acting user's `is_admin` permission, same as the global
        Users API. A grant only adds `can_view`/`can_edit`/`can_delete`
        capability for that specific map on top of the user's global
        permissions — it never removes capability a user's global flags
        already give them.
      responses:
        "200":
          description: Array of grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapPermission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /maps/{id}/permissions/{username}:
    parameters:
      - $ref: "#/components/parameters/MapId"
      - name: username
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [maps]
      summary: Grant or replace a user's per-map permission
      description: Requires the acting user's `is_admin` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapPermissionRequest"
      responses:
        "200":
          description: Grant created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapPermission"
        "400":
          description: Invalid request body, or the map/username doesn't exist
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [maps]
      summary: Revoke a user's per-map permission
      description: Requires the acting user's `is_admin` permission. A no-op if no grant exists.
      responses:
        "204":
          description: Grant revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users:
    get:
      tags: [users]
      summary: List users
      description: Requires the acting user's `is_admin` permission. Responses never include the password hash.
      responses:
        "200":
          description: Array of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [users]
      summary: Create a user
      description: Requires the acting user's `is_admin` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body, or missing username/password
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username already taken
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /users/{username}:
    parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [users]
      summary: Update a user's permissions (and optionally password)
      description: >-
        Requires the acting user's `is_admin` permission. All four permission
        flags are replaced (not partial); `password` is optional and, when
        omitted or empty, leaves the existing password unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      tags: [users]
      summary: Delete a user
      description: Requires the acting user's `is_admin` permission. You cannot delete your own account.
      responses:
        "204":
          description: User deleted
        "400":
          description: Attempted to delete your own account
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /maps/{id}/version/{version}/bounds:
    parameters:
      - $ref: "#/components/parameters/MapId"
      - name: version
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [files]
      summary: Compute the real-world extent of a map version's tile pyramid
      description: >-
        Scans the extracted `z/x/y.png` files under
        `<data-root>/<id>/<version>/` (no bounds are stored) and returns the
        lon/lat bounding box, derived from the tiles at the lowest zoom level
        present, plus that level as `minZoom` and the highest level present as
        `maxZoom`. Intended for initializing a preview map's view. Requires
        view access to this map (see `GET /maps`); no `can_*` action
        permission is required.
      responses:
        "200":
          description: Computed bounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TileBounds"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Version not found or has no tiles

  /maps/{id}/version/{version}/{filePath}:
    parameters:
      - $ref: "#/components/parameters/MapId"
      - name: version
        in: path
        required: true
        schema:
          type: string
      - name: filePath
        in: path
        required: true
        schema:
          type: string
        description: >
          Path of the file within this version's extracted contents, e.g.
          `0/0/0.png`. This template represents one segment for documentation
          purposes; the server actually serves arbitrarily nested paths under
          `<data-root>/<id>/<version>/`.
    get:
      tags: [files]
      summary: Fetch an extracted tile file from a map version
      security: []
      description: >-
        Serves files straight out of `<data-root>/<id>/<version>/`. If the
        map has `anonymousAllowed` set, this one endpoint may be called with
        no bearer token at all; otherwise it requires view access to the map
        (see `GET /maps`), same as every other read endpoint — no `can_*`
        action permission is required either way.
      responses:
        "200":
          description: File contents
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Version or file not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: JWT passed as a query parameter instead of the Authorization header.

  parameters:
    MapId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing, invalid, or expired token
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    Forbidden:
      description: Acting user lacks the required permission
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    NotFound:
      description: Map not found
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorMessage"

  schemas:
    ErrorMessage:
      type: string
      description: Plain-text error message.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        ttl_seconds:
          type: integer
          format: int64
          description: Requested token lifetime in seconds. Defaults to 24h; capped at 7 days.
          example: 3600

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        refresh_token:
          type: string
          description: >-
            Single-use token that can be redeemed at POST /refresh for a new
            login token (and a new refresh token) without re-authenticating.

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    MapRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        currentVersion:
          type: string
        visibleToAll:
          type: boolean
          description: Whether every authenticated user can see this map. Defaults to false (private) if omitted.
        anonymousAllowed:
          type: boolean
          description: >-
            Whether GET /maps/{id}/version/{version}/* (raw tile files) may
            be fetched with no bearer token at all. Independent of
            `visibleToAll` — a map can be private to authenticated users yet
            still serve tiles anonymously, or vice versa. Defaults to false
            if omitted.

    Map:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        currentVersion:
          type: string
        visibleToAll:
          type: boolean
          description: >-
            Whether every authenticated user can see this map. When false,
            only admins, the creator, users whose global `can_edit`/`can_delete`
            already lets them act on any map, and users with a per-map grant
            can see it.
        anonymousAllowed:
          type: boolean
          description: >-
            Whether this map's tile files can be fetched with no bearer
            token at all (see `GET /maps/{id}/version/{version}/{filePath}`).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string

    MapVersion:
      type: object
      properties:
        version:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string

    TileBounds:
      type: object
      properties:
        minZoom:
          type: integer
          description: Lowest zoom level with tiles on disk; used as the bounding box source.
        maxZoom:
          type: integer
          description: Highest zoom level with tiles on disk.
        west:
          type: number
          format: double
        south:
          type: number
          format: double
        east:
          type: number
          format: double
        north:
          type: number
          format: double
        centerLng:
          type: number
          format: double
        centerLat:
          type: number
          format: double

    UserRequest:
      type: object
      required: [canCreate, canEdit, canDelete, isAdmin]
      properties:
        username:
          type: string
          description: Required when creating a user; ignored on update (the path parameter is authoritative).
        password:
          type: string
          description: Required when creating a user. On update, optional — omit or leave empty to keep the current password.
        canCreate:
          type: boolean
        canEdit:
          type: boolean
        canDelete:
          type: boolean
        isAdmin:
          type: boolean

    User:
      type: object
      properties:
        username:
          type: string
        canCreate:
          type: boolean
        canEdit:
          type: boolean
        canDelete:
          type: boolean
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time

    MapPermissionRequest:
      type: object
      required: [canView, canEdit, canDelete]
      properties:
        canView:
          type: boolean
        canEdit:
          type: boolean
        canDelete:
          type: boolean

    MapPermission:
      type: object
      properties:
        username:
          type: string
        canView:
          type: boolean
        canEdit:
          type: boolean
        canDelete:
          type: boolean
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          type: string
